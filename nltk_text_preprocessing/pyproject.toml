[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nltk_text_preprocessing"
version = "0.1.0"
description = "Text preprocessing of financial news sentiment data with NLTK (converted from an IISc / TalentSprint Colab notebook)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "nltk>=3.9",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["config*", "utils*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
